<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="gradD" gradientUnits="userSpaceOnUse" x1="24" y1="34" x2="106" y2="126">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>

    <linearGradient id="gradC" gradientUnits="userSpaceOnUse" x1="60" y1="34" x2="152" y2="126">
      <stop offset="0%" stop-color="#2979FF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <clipPath id="cruceFav">
      <rect x="60" y="80" width="70" height="70" />
    </clipPath>
  </defs>

  <!-- Fondo estilo ícono Apple -->
  <rect x="6" y="6" width="168" height="168" rx="38" fill="#0B1120" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(4, 10)">
    <!-- 1. Letra D completa y uniforme -->
    <path d="M 24,34 H 60 A 46,46 0 0,1 60,126 H 24 Z" fill="none" stroke="url(#gradD)" stroke-width="20" stroke-linejoin="miter" />

    <!-- 2. Letra C completa y uniforme -->
    <path d="M 152,58 A 46,46 0 1,0 152,102" fill="none" stroke="url(#gradC)" stroke-width="20" stroke-linecap="butt" />

    <!-- 3. Cruce inferior limpio usando exactamente el mismo trazado de la D -->
    <path d="M 24,34 H 60 A 46,46 0 0,1 60,126 H 24 Z" fill="none" stroke="url(#gradD)" stroke-width="20" stroke-linejoin="miter" clip-path="url(#cruceFav)" />
  </g>
</svg>