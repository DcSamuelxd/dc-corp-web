<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Iniciar Sesión — Intranet DC CORP</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/intranet/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/intranet/css/styles.css?v=20261124-2">
</head>
<body class="page-login flex flex-col justify-between px-4 py-6 sm:p-8">

  <!-- ==================== HEADER ==================== -->
  <div class="w-full max-w-md mx-auto flex items-center justify-between">
    <a href="/" class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#6e6e73] hover:text-[#1d1d1f] py-2 px-3 rounded-full bg-white/70 border border-black/[0.06]">
      <i class="fa-solid fa-arrow-left"></i> Inicio
    </a>
    <span id="deviceBadge" class="text-[11px] font-medium text-[#6e6e73] px-3 py-1 rounded-full bg-white/70 border border-black/[0.06]">
      Portal Académico
    </span>
  </div>

  <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
  <main class="w-full max-w-md mx-auto my-auto py-6">
    <div class="glass-card p-6 sm:p-9 space-y-6">
      <div class="text-center space-y-2">
        <img src="/logo.svg" alt="DC CORP" class="h-12 sm:h-14 mx-auto">
        <h1 class="text-2xl font-bold tracking-tight text-[#1d1d1f] pt-1">Intranet Académica</h1>
        <p class="text-xs sm:text-sm text-[#6e6e73]">Ingresa con tu usuario o DNI asignado</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="code" class="block text-xs font-semibold text-[#424245] mb-1.5">Usuario o DNI</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#6e6e73] text-sm">
              <i class="fa-regular fa-user"></i>
            </span>
            <input type="text" id="code" required autocomplete="username" autocapitalize="none" autocorrect="off"
              placeholder="Ej: 74859612 o prof.diosdi"
              class="w-full bg-white border border-black/15 rounded-2xl pl-10 pr-4 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] focus:ring-2 focus:ring-[#0071e3]/15 transition">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-[#424245] mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#6e6e73] text-sm">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required autocomplete="current-password"
              placeholder="••••••••"
              class="w-full bg-white border border-black/15 rounded-2xl pl-10 pr-12 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] focus:ring-2 focus:ring-[#0071e3]/15 transition">
            <button type="button" onclick="togglePassVisibility()" aria-label="Mostrar contraseña"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-[#6e6e73] hover:text-[#1d1d1f] text-sm">
              <i id="eyeIcon" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="errorBox" class="hidden p-3.5 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-700 text-xs font-semibold text-center"></div>

        <button type="submit" id="submitBtn"
          class="w-full py-3.5 rounded-2xl bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.99] text-white text-sm font-semibold shadow-sm transition">
          Ingresar a la Intranet
        </button>
      </form>

      <!-- Aviso instalable en Android / iOS -->
      <div id="installHint" class="hidden pt-3 border-t border-black/[0.06] text-center">
        <p class="text-[11px] text-[#6e6e73]" id="installHintText"></p>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="text-center text-[11px] text-[#6e6e73]">
    DC CORP &bull; Sol Music Academia
  </footer>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="/intranet/js/login.js?v=20261124-2"></script>
</body>
</html>
